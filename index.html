<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل قراءات الوحدة 31 - شركة أبو قير للأسمدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b3a5c;--green:#1e8e5a;--red:#dc2626;--gold:#e9c46a;--bg:#eceef1;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--navy);padding-bottom:30px;-webkit-tap-highlight-color:transparent;font-size:14px}

header{background:var(--navy);border-bottom:4px solid var(--green);box-shadow:0 4px 10px rgba(0,0,0,.15);padding:12px 14px}
.head-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{flex:0 0 62px;width:62px;height:62px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px}
.logo img{width:100%;height:100%;object-fit:contain}
.head-txt h1{color:#fff;font-size:16px;font-weight:800;line-height:1.35}
.head-txt p{color:var(--gold);font-size:11px;font-weight:600;direction:ltr;text-align:right;line-height:1.4;margin-top:2px}

main{max-width:480px;margin:0 auto;padding:12px 10px 0}

.status{background:#fff;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12.5px;box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:9px}
.dot{width:12px;height:12px;border-radius:50%;background:#34c993}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn{border:0;font-family:inherit;font-weight:700;font-size:13px;color:#fff;border-radius:12px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.share{background:#16a34a;grid-column:1/-1;font-size:15px;padding:12px}
.btn.print{background:var(--navy)}
.btn.clear{background:#dc2626}
.btn.restore{background:#9ca3af;grid-column:1/-1}

.card{background:#fff;border-radius:24px;border:1.5px solid #d2e7df;box-shadow:0 6px 18px rgba(11,58,92,.09);padding:18px 14px 16px}
.card h2.title{font-size:21px;font-weight:800;line-height:1.4}
.card h2.title span{color:var(--green)}
.card .sub{color:var(--muted);font-size:12px;line-height:1.6;margin-top:3px}
.chip{display:inline-block;margin-top:10px;padding:5px 18px;border:1.5px solid #b9e0cf;background:#eef9f3;color:var(--green);font-weight:700;font-size:13px;border-radius:10px}
.hr{height:3px;background:#bfdcd2;border-radius:2px;margin:16px 0 18px}
.sec{border-inline-start:5px solid var(--green);padding-inline-start:9px;font-size:16px;font-weight:800;margin-bottom:10px;line-height:1.3}

.row{display:flex;align-items:center;gap:6px;border-radius:16px;padding:8px 12px;margin-bottom:8px;min-height:52px}
.row .lbl{font-weight:800;font-size:14.5px;white-space:nowrap}
.row .ctl{margin-inline-start:auto;display:flex;align-items:center;gap:5px;direction:ltr}
.row .u{font-weight:800;font-size:13px}
.row input{width:88px;height:38px;border-radius:12px;background:#fff;text-align:center;font-family:inherit;font-weight:800;font-size:17px;color:#1f2937;border:2.5px solid;outline:none}
.row input:focus{box-shadow:0 0 0 3px rgba(30,142,90,.2)}
.row.basic{background:#edf8f2;border:1.5px solid #cfe6dc}
.row.basic .lbl,.row.basic .u{color:var(--navy)}
.row.basic .u.pct{color:var(--green)}
.row.basic input{border-color:#a5d1bf}
.row.na{background:#fffbe9;border:1.5px solid #fbe48f}
.row.na .lbl{color:#8a3b0c}.row.na .u{color:#a35c1c}
.row.na input{border-color:#f9d553}
.row.load{background:#effcfa;border:1.5px solid #9ae8e0}
.row.load .lbl{color:#0f5460;font-style:italic}
.row.load .u{color:#0f5460}
.row.load input{width:62px;height:36px;border-width:2px;border-color:#6fe0d3;font-size:16px}

.block-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.block-head h3{font-size:18px;font-weight:800;line-height:1.35}
.badge{color:#fff;font-weight:800;font-size:12px;padding:4px 13px;border-radius:999px}
.b12{background:var(--navy)}.b24{background:var(--green)}
.fq{border-radius:20px;padding:12px 16px 16px;margin-bottom:12px;text-align:center}
.fq.p12{background:#f8fafc;border:1.5px solid #e4e8f0}
.fq.p24{background:#f3fdf9;border:1.5px solid #b9ecd6}
.fq h4{font-size:22px;font-style:italic;font-weight:800;color:var(--navy);margin:4px 0 10px}
.fq .fl{font-size:13px;font-weight:600;color:#6b7280;margin-bottom:5px}
.fq input{width:78%;height:44px;border:2.5px solid #fecaca;border-radius:14px;background:#fff;text-align:center;font-family:inherit;font-weight:800;font-size:22px;color:var(--red);outline:none;margin-bottom:10px}
.fq input:focus{box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.fq .line{height:6px;border-radius:4px;width:84%;margin:4px auto 12px}
.p12 .line{background:var(--green)}.p24 .line{background:var(--navy)}
.fq .rl{font-size:13.5px;font-weight:700}
.p12 .rl{color:var(--green)}.p24 .rl{color:var(--navy)}
.fq .res{margin-top:4px;font-size:36px;font-weight:800;color:var(--red);display:flex;align-items:baseline;justify-content:center;gap:7px;direction:ltr}
.fq .res small{font-size:19px;font-weight:700}

footer{margin-top:18px;padding-top:12px;border-top:1.5px solid #e3e8ec;text-align:center;color:#9aa3ad;font-size:11px;line-height:1.7}

/* Share sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px 20px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h5{font-size:16px;font-weight:800;margin-bottom:12px;text-align:center}
.sheet button{width:100%;border:0;font-family:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:12px;margin-bottom:8px;cursor:pointer;color:#fff}
.sheet .wa{background:#16a34a}.sheet .sh{background:var(--navy)}.sheet .cp{background:#64748b}.sheet .cl{background:#e5e7eb;color:#374151}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;display:none;z-index:60}

@media print{.btns,.status,.ov{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
