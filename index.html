<!-- قسم أزرار المشاركة الذكية -->
<div class="mt-6 p-4 bg-white rounded-xl shadow-md border border-gray-200 text-center">
    <h3 class="text-lg font-bold text-gray-800 mb-3">مشاركة القراءات الحالية</h3>
    <div class="flex flex-wrap justify-center gap-3">
        <!-- زر مشاركة واتساب -->
        <button onclick="shareViaWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition">
            <span>واتساب</span>
        </button>
        
        <!-- زر نسخ التقرير الشامل للصق في أي تطبيق (تيك توك، انستجرام، فيسبوك) -->
        <button onclick="copyReportForSocial()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition">
            <span>نسخ التقرير (لكل التطبيقات)</span>
        </button>
    </div>
</div>

<script>
// دالة لتجهيز النص الحالي وإرساله عبر واتساب
function shareViaWhatsApp() {
    // 1. التأكد من حفظ البيانات الحالية أولاً
    if (typeof saveToLocalStorage === 'function') {
        saveToLocalStorage();
    }
    
    // 2. تجميع البيانات الحالية من حقول الإدخال في الصفحة
    let reportText = "📊 *تقرير بيانات الوحدة 31 - أبو قير للأسمدة*\n\n";
    
    // جلب الحقول (تأكد من مطابقة الـ IDs مع الكود لديك أو جلبها ديناميكياً)
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        if(input.value && input.id) {
            reportText += `- ${input.id}: ${input.value}\n`;
        }
    });

    reportText += "\n🕒 *تم التحديث بالقراءات المتاحة حالياً*";

    // 3. فتح واتساب بالمراسلة الجاهزة
    let encodedUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(reportText);
    window.open(encodedUrl, '_blank');
}

// دالة لنسخ النص لصقه في أي منصة أخرى (تيك توك، انستجرام، فيسبوك)
function copyReportForSocial() {
    let reportText = "📊 *تقرير بيانات الوحدة 31 - أبو قير للأسمدة*\n\n";
    
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        if(input.value) {
            reportText += `- ${input.placeholder || input.id}: ${input.value}\n`;
        }
    });

    navigator.clipboard.writeText(reportText).then(() => {
        alert("تم نسخ التقرير الحالي بنجاح! يمكنك لصقه الآن في أي تطبيق (تيك توك، انستجرام، فيسبوك).");
    }).catch(err => {
        alert("فشل النسخ، يجدر المحاولة مرة أخرى.");
    });
}
</script>
