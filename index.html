<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#223a5e">
<title>وحدة 31</title>
<meta name="application-name" content="وحدة 31">
<meta name="apple-mobile-web-app-title" content="وحدة 31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--text:#1d2a3a;--mute:#6b7788;--line:#cfd6e2;--head:#223a5e;
--g:#2e7d4f;--gbg:#eef8f1;--b:#2a3fa8;--bbg:#eef1fb;--r:#a33;--rbg:#fbf0f0;--y:#7a4a1a;--ybg:#fff9e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#1a2230;--text:#e8edf5;--mute:#93a0b3;--line:#35425a;--head:#16233b;
--g:#6fcf97;--gbg:#14261c;--b:#8fa4ff;--bbg:#161d38;--r:#ff8a8a;--rbg:#2e1a1a;--y:#e6b872;--ybg:#2a2314}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--head);color:#fff;padding:6px 12px;border-bottom:3px solid #4c9a6a;display:flex;align-items:baseline;gap:8px;flex:none}
header h1{margin:0;font-size:16px}header small{opacity:.75;font-size:11px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:5px;padding:5px}
.col{border:2px solid;border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:5px;min-height:0}
.col h2{margin:0;font-size:11px;border-inline-start:3px solid;padding-inline-start:5px;flex:none}
.m{background:var(--gbg);border-color:var(--g);color:var(--g)}
.p12{background:var(--rbg);border-color:var(--line);color:var(--text)}
.p24{background:var(--bbg);border-color:var(--line);color:var(--b)}
.card{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 5px;color:var(--text)}
.card label{display:block;font-size:11px;font-weight:700}
.row{display:flex;align-items:center;gap:3px}
.u{font-size:10px;color:var(--mute)}
input{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:700 14px system-ui;text-align:center;padding:3px 1px}
.fq{font-style:italic;font-weight:800;font-size:11px;direction:ltr;text-align:right}
.out{border-top:2px solid var(--head);padding-top:3px;font-weight:800;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.out b{font-size:15px}
.tanks{flex:none;margin:0 5px 5px;background:var(--ybg);border:2px solid #e3c677;border-radius:10px;padding:5px 8px;color:var(--y)}
.tanks h2{margin:0 0 3px;font-size:11px;direction:ltr;text-align:right}
.tr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;text-align:center;font-weight:700;font-size:11px}
.l{grid-template-columns:repeat(4,1fr);direction:rtl;margin-top:5px;font-size:10px;border-top:1px dashed #e3c677;padding-top:5px}
.rst{margin-inline-start:auto;background:#c0392b;color:#fff;border:0;border-radius:8px;padding:5px 12px;font:700 12px system-ui}
</style>
</head>
<body>
<header><h1>الوحدة 31</h1><small>البيانات المباشرة</small><button class="rst" id="rst">تصفير</button></header>
<div class="grid">
  <div class="col m" id="meas"><h2>التحاليل والقياسات 12H</h2></div>
  <div class="col p12" id="c12"><h2>إنتاج 12 ساعة</h2></div>
  <div class="col p24" id="c24"><h2>إنتاج 24 ساعة</h2></div>
</div>
<div class="tanks"><h2>Tank Levels</h2><div class="tr" id="tanks"></div>
<div class="tr l" id="lines"></div></div>
<script>
var S={};try{S=JSON.parse(localStorage.getItem("u31")||"{}")}catch(e){}
function save(){try{localStorage.setItem("u31",JSON.stringify(S))}catch(e){}}
function inp(id){return '<input id="'+id+'" type="number" inputmode="decimal" step="any" value="'+(S[id]!=null?S[id]:"")+'">'}
var meas=[["حرارة الأمونيا","°c"],["كثافة الأمونيا",""],["حرارة الحامض","°c"],["تركيز الحامض",""],["كثافة الحامض",""],["متوسط التركيز","%"]];
document.getElementById("meas").insertAdjacentHTML("beforeend",meas.map(function(m,i){
 return '<div class="card"><label>'+m[0]+'</label><div class="row">'+inp("m"+i)+'<span class="u">'+m[1]+'</span></div></div>'}).join(""));
["12","24"].forEach(function(h){
 var h2='';["FQ401","FQ402"].forEach(function(q){var k=q+"_"+h;
  h2+='<div class="card"><div class="fq">'+q+' ('+h+'H)</div><label>الحالية</label>'+inp(k+"c")+
  '<label>السابقة</label>'+inp(k+"p")+
  '<div class="out">الإنتاج<b><span id="'+k+'o">0</span> <span class="u">m³</span></b></div></div>'});
 document.getElementById("c"+h).insertAdjacentHTML("beforeend",h2)});
document.getElementById("tanks").innerHTML=["22Li503","22Li501","31Li509"].map(function(t,i){
 return '<div>'+t+inp("t"+i)+'</div>'}).join("");
document.getElementById("lines").innerHTML=[["حرارة الخط الأول","l1"],["حرارة الخط الأول","t1"],["حمل الخط الثاني","l2"],["حرارة الخط الثاني","t2"]].map(function(x){
 return '<div>'+x[0]+(x[1].charAt(0)=="l"?'<div class="row">'+inp(x[1])+'<span class="u">%</span></div>':'<div class="row">'+inp(x[1])+'<span class="u">°c</span></div>')+'</div>'}).join("");
function calc(){["12","24"].forEach(function(h){["FQ401","FQ402"].forEach(function(q){var k=q+"_"+h;
 var c=parseFloat(document.getElementById(k+"c").value)||0,p=parseFloat(document.getElementById(k+"p").value)||0;
 document.getElementById(k+"o").textContent=Math.round((c-p)*100)/100})})}
document.querySelectorAll("input").forEach(function(e){e.addEventListener("input",function(){S[e.id]=e.value;save();calc()})});
calc();
var rb=document.getElementById("rst"),rt;
rb.addEventListener("click",function(){
 if(!rt){rb.textContent="متأكد؟ اضغط تاني";rt=setTimeout(function(){rt=0;rb.textContent="تصفير"},3000);return}
 clearTimeout(rt);rt=0;rb.textContent="تصفير";S={};save();
 document.querySelectorAll("input").forEach(function(e){e.value=""});calc()});
</script>
</body>
</html>
